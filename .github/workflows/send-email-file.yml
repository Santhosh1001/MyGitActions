name: Send File Through Email

on:
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Text File
        run: |
          echo "Hello Santhosh, this file was generated by GitHub Actions." > santhosh.txt
          echo "Date: $(date)" >> santhosh.txt

      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: Santhoshmr1001@gmail.com
          password: Schne1der@
          subject: "GitHub Actions File"
          body: "Attached is the generated file."
          to: santhoshmr1001@gmail.com
          from: GitHub Action
          attachments: santhosh.txt
